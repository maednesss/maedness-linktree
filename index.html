<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MÆDNESS — Event Link</title>
  <meta
    name="description"
    content="MÆDNESS — Halloween: The Heart Exchange."
  >
  <meta name="theme-color" content="#050505">

  <meta property="og:title" content="MÆDNESS — Halloween: The Heart Exchange">
  <meta
    property="og:description"
    content="Apri il link ufficiale dell'evento MÆDNESS."
  >
  <meta
    property="og:image"
    content="https://ugc.production.linktr.ee/d176df1d-e8e2-412a-9403-5e9816f9538b_IMG-5692.jpeg"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --red: #ff1010;
      --black: #050505;
      --white: #f7f7f7;
      --muted: rgba(255, 255, 255, .55);
      --line: rgba(255, 255, 255, .16);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(
          ellipse at 50% 28%,
          rgba(100, 0, 0, .25) 0,
          rgba(5, 5, 5, 0) 44%
        ),
        var(--black);
      color: var(--white);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: .14;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 4px,
          rgba(255, 255, 255, .055) 5px
        );
    }

    body::after {
      position: fixed;
      z-index: 0;
      top: -30%;
      left: -40%;
      width: 180%;
      height: 30%;
      content: "";
      pointer-events: none;
      opacity: .12;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(255, 16, 16, .2),
        transparent
      );
      animation: backgroundScan 9s linear infinite;
    }

    a {
      color: inherit;
    }

    .scroll-progress {
      position: fixed;
      z-index: 10;
      top: 52px;
      right: 8px;
      bottom: 18px;
      width: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, .18);
    }

    .scroll-progress span {
      display: block;
      width: 100%;
      height: 0;
      background: var(--red);
      transform-origin: top;
      box-shadow: 0 0 8px rgba(255, 16, 16, .8);
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 24px 20px 20px;
      animation: pageReveal .7s ease both;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 30px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .topbar-brand {
      font-family: "Anton", sans-serif;
      font-size: 15px;
      letter-spacing: .07em;
    }

    .topbar-signal {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      color: var(--red);
      text-align: right;
    }

    .signal-dot {
      position: relative;
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 9px rgba(255, 16, 16, .85);
      animation: signalPulse 1.5s ease-in-out infinite;
    }

    .signal-dot::after {
      position: absolute;
      inset: -4px;
      content: "";
      border: 1px solid rgba(255, 16, 16, .65);
      border-radius: 50%;
      animation: signalRipple 1.5s ease-out infinite;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 32px;
      text-align: center;
      animation: sectionReveal .7s .08s ease both;
    }

    .avatar-frame {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 17px;
      padding: 4px;
      border: 1px solid rgba(255, 16, 16, .75);
      border-radius: 50%;
      box-shadow:
        0 0 20px rgba(255, 16, 16, .13),
        inset 0 0 14px rgba(255, 16, 16, .08);
    }

    .avatar-frame::before,
    .avatar-frame::after {
      position: absolute;
      width: 12px;
      height: 12px;
      content: "";
      border-color: var(--red);
      border-style: solid;
    }

    .avatar-frame::before {
      top: -4px;
      left: 17px;
      border-width: 1px 0 0 1px;
    }

    .avatar-frame::after {
      right: 17px;
      bottom: -4px;
      border-width: 0 1px 1px 0;
    }

    .avatar-orbit {
      position: absolute;
      z-index: 2;
      inset: -6px;
      border: 1px solid transparent;
      border-top-color: var(--red);
      border-right-color: rgba(255, 16, 16, .28);
      border-radius: 50%;
      animation: orbit 7s linear infinite;
      pointer-events: none;
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      animation: logoBreath 4s ease-in-out infinite;
    }

    .profile-kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--red);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Anton", sans-serif;
      font-size: clamp(48px, 15vw, 68px);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.025em;
      text-shadow:
        3px 0 rgba(255, 16, 16, .72),
        -1px 0 rgba(255, 255, 255, .22);
      animation: wordmarkFlicker 5s ease-in-out infinite;
    }

    .profile-caption {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .marquee {
      position: relative;
      width: calc(100% + 40px);
      margin: 0 -20px 23px;
      overflow: hidden;
      border-top: 1px solid rgba(255, 16, 16, .32);
      border-bottom: 1px solid rgba(255, 16, 16, .32);
      background: rgba(255, 16, 16, .035);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marqueeMove 22s linear infinite;
    }

    .marquee-text {
      display: block;
      padding: 9px 0;
      color: rgba(255, 255, 255, .62);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .marquee-text span {
      padding: 0 17px;
      color: var(--red);
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .section-label span:last-child {
      color: var(--red);
    }

    .event-link {
      position: relative;
      display: block;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .24);
      background: #0b0b0b;
      color: var(--white);
      text-decoration: none;
      transform: translateY(10px);
      opacity: 0;
      animation: cardReveal .75s .16s cubic-bezier(.22, .75, .25, 1) forwards;
      transition:
        border-color .22s ease,
        transform .22s ease,
        box-shadow .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .event-link:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 4px;
    }

    .event-link:active {
      transform: scale(.985);
    }

    .event-link::before {
      position: absolute;
      z-index: 3;
      top: 0;
      left: -100%;
      width: 70%;
      height: 1px;
      content: "";
      background: linear-gradient(
        90deg,
        transparent,
        var(--red),
        transparent
      );
      animation: borderSweep 4s ease-in-out infinite;
      pointer-events: none;
    }

    .event-image-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #160707;
    }

    .event-image-wrap::before {
      position: absolute;
      z-index: 1;
      top: -20%;
      left: 0;
      width: 100%;
      height: 16%;
      content: "";
      background: linear-gradient(
        180deg,
        transparent,
        rgba(255, 16, 16, .44),
        transparent
      );
      animation: imageScan 5s ease-in-out infinite;
      pointer-events: none;
    }

    .event-image-wrap::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      content: "";
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, .03) 42%,
          rgba(0, 0, 0, .48) 100%
        );
    }

    .event-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform .55s cubic-bezier(.2, .7, .2, 1),
        filter .4s ease;
    }

    .event-number {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 12px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: rgba(5, 5, 5, .7);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .17em;
    }

    .event-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 76px;
      padding: 14px 15px 15px;
      border-top: 1px solid rgba(255, 255, 255, .12);
    }

    .event-copy {
      min-width: 0;
    }

    .event-copy-label {
      margin-bottom: 7px;
      color: var(--red);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .event-title {
      margin: 0;
      font-family: "Anton", sans-serif;
      font-size: clamp(19px, 5.7vw, 25px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: .015em;
    }

    .event-arrow {
      display: grid;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--red);
      color: var(--red);
      animation: arrowPulse 2.2s ease-in-out infinite;
      transition:
        background .22s ease,
        color .22s ease,
        transform .22s ease;
    }

    .event-arrow svg {
      display: block;
      width: 16px;
      height: 16px;
    }

    .event-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 15px;
      border-top: 1px solid rgba(255, 255, 255, .12);
      color: var(--muted);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .event-cta span:last-child {
      color: var(--red);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 38px;
      color: var(--muted);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      animation: sectionReveal .7s .35s ease both;
    }

    .footer-mark {
      color: var(--white);
      font-family: "Anton", sans-serif;
      font-size: 12px;
      letter-spacing: .07em;
    }

    .footer-line {
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    @keyframes pageReveal {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes sectionReveal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoBreath {
      0%, 100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.14);
      }
    }

    @keyframes wordmarkFlicker {
      0%, 93%, 100% {
        opacity: 1;
        text-shadow:
          3px 0 rgba(255, 16, 16, .72),
          -1px 0 rgba(255, 255, 255, .22);
      }

      94% {
        opacity: .88;
        text-shadow:
          5px 0 rgba(255, 16, 16, .9),
          -2px 0 rgba(255, 255, 255, .3);
      }

      96% {
        opacity: 1;
      }
    }

    @keyframes signalPulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .55;
        transform: scale(.78);
      }
    }

    @keyframes signalRipple {
      0% {
        opacity: .8;
        transform: scale(.55);
      }

      100% {
        opacity: 0;
        transform: scale(1.7);
      }
    }

    @keyframes backgroundScan {
      0% {
        transform: translateY(-30vh) rotate(-12deg);
      }

      100% {
        transform: translateY(150vh) rotate(-12deg);
      }
    }

    @keyframes imageScan {
      0%, 18% {
        top: -20%;
      }

      76%, 100% {
        top: 110%;
      }
    }

    @keyframes borderSweep {
      0%, 12% {
        left: -100%;
      }

      64%, 100% {
        left: 140%;
      }
    }

    @keyframes arrowPulse {
      0%, 100% {
        box-shadow: 0 0 0 rgba(255, 16, 16, 0);
      }

      50% {
        box-shadow: 0 0 14px rgba(255, 16, 16, .2);
      }
    }

    @keyframes marqueeMove {
      to {
        transform: translateX(-50%);
      }
    }

    @media (hover: hover) {
      .event-link:hover {
        border-color: var(--red);
        box-shadow: 0 0 26px rgba(255, 16, 16, .16);
        transform: translateY(-2px);
      }

      .event-link:hover .event-image {
        filter: contrast(1.08) saturate(1.08);
        transform: scale(1.035);
      }

      .event-link:hover .event-arrow {
        transform: translate(2px, -2px);
        background: var(--red);
        color: var(--black);
        animation-play-state: paused;
      }
    }

    @media (max-width: 360px) {
      .page {
        padding-right: 16px;
        padding-left: 16px;
      }

      .profile {
        padding-top: 38px;
      }

      .event-title {
        font-size: 19px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="scroll-progress" aria-hidden="true">
    <span id="scrollProgress"></span>
  </div>

  <main class="page">

    <header class="topbar">
      <div class="topbar-brand">MÆDNESS</div>

      <div class="topbar-signal">
        <span class="signal-dot" aria-hidden="true"></span>
        <span id="signalText">MÆDNESS / EVENT INDEX</span>
      </div>
    </header>

    <section class="profile" aria-labelledby="profile-title">
      <div class="avatar-frame">
        <span class="avatar-orbit" aria-hidden="true"></span>
        <img
          class="avatar"
          src="https://ugc.production.linktr.ee/4035012a-7d56-433f-9e0c-68214cc77aff_image.png"
          alt="Logo MÆDNESS"
          width="86"
          height="86"
        >
      </div>

      <div class="profile-kicker">
        <span class="signal-dot" aria-hidden="true"></span>
        OFFICIAL EVENTS LINK
      </div>

      <h1 id="profile-title">MÆDNESS</h1>
      <p class="profile-caption">FOGGIA / ITALY</p>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <span class="marquee-text">
          MÆDNESS <span>✳</span> EVENT ACCESS <span>✳</span> FOGGIA / ITALY <span>✳</span>
        </span>
        <span class="marquee-text">
          MÆDNESS <span>✳</span> EVENT ACCESS <span>✳</span> FOGGIA / ITALY <span>✳</span>
        </span>
      </div>
    </div>

    <section aria-label="Link evento">
      <div class="section-label">
        <span>01 / Event Access</span>
        <span>Open Link</span>
      </div>

      <a
        class="event-link"
        href="https://pleasuresfc.it/#maednesshalloween"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Apri HALLOWEEN: THE HEART EXCHANGE"
      >
        <div class="event-image-wrap">
          <img
            class="event-image"
            src="https://ugc.production.linktr.ee/d176df1d-e8e2-412a-9403-5e9816f9538b_IMG-5692.jpeg"
            alt="Locandina Halloween: The Heart Exchange"
            width="1200"
            height="675"
          >
          <span class="event-number">MÆDNESS / 001</span>
        </div>

        <div class="event-info">
          <div class="event-copy">
            <div class="event-copy-label">Event Link</div>
            <h2 class="event-title">HALLOWEEN: THE HEART EXCHANGE</h2>
          </div>

          <span class="event-arrow" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M7 17L17 7M8 7H17V16"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="square"
                stroke-linejoin="miter"
              />
            </svg>
          </span>
        </div>

        <div class="event-cta">
          <span>Tap to enter</span>
          <span>Access / 001</span>
        </div>
      </a>
    </section>

    <footer class="footer">
      <span class="footer-mark">MÆDNESS</span>
      <span class="footer-line" aria-hidden="true"></span>
      <span>Signal / Open</span>
    </footer>

  </main>

  <script>
    const progressBar =
      document.getElementById("scrollProgress");

    const signalText =
      document.getElementById("signalText");

    const reduceMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let scrollScheduled = false;

    function updateScrollProgress() {
      const scrollableHeight =
        document.documentElement.scrollHeight - window.innerHeight;

      const progress =
        scrollableHeight > 0
          ? (window.scrollY / scrollableHeight) * 100
          : 0;

      progressBar.style.height =
        `${progress}%`;

      scrollScheduled = false;
    }

    window.addEventListener(
      "scroll",
      () => {
        if (!scrollScheduled) {
          window.requestAnimationFrame(updateScrollProgress);
          scrollScheduled = true;
        }
      },
      { passive: true }
    );

    window.addEventListener(
      "resize",
      updateScrollProgress,
      { passive: true }
    );

    updateScrollProgress();

    if (!reduceMotion && signalText) {
      const signals = [
        "MÆDNESS / EVENT INDEX",
        "SIGNAL / ACTIVE",
        "FOGGIA / ITALY",
        "ACCESS / OPEN"
      ];

      const matrixChars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 /.-_:Æ";

      let signalIndex = 0;

      function scrambleSignal(nextText) {
        let frame = 0;
        const totalFrames = 7;

        const scramble = window.setInterval(() => {
          frame++;

          signalText.textContent =
            Array.from(nextText)
              .map((character, index) => {
                if (character === " ") {
                  return " ";
                }

                if (index < frame || Math.random() < .2) {
                  return character;
                }

                return matrixChars[
                  Math.floor(Math.random() * matrixChars.length)
                ];
              })
              .join("");

          if (frame >= totalFrames) {
            window.clearInterval(scramble);
            signalText.textContent = nextText;
          }
        }, 38);
      }

      window.setInterval(() => {
        signalIndex =
          (signalIndex + 1) % signals.length;

        scrambleSignal(signals[signalIndex]);
      }, 2400);
    }
  </script>
</body>
</html>
